name: Build APK

on:
  push:
    branches: [develop, feature/*]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      - name: Build Debug APK
        run: ./gradlew :app:assembleGplayDebug --no-daemon --max-workers=2 --stacktrace
        env:
          JAVA_OPTS: "-Xmx2g"
          GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=768m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: matrix-debug-${{ github.run_number }}
          path: app/build/outputs/apk/gplay/debug/*.apk
          retention-days: 30
